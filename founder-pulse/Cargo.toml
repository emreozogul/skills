[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
description = "Cross-project daily briefing — scans all your project dirs for git activity, uncommitted work, open TODOs, and stale projects"
license = "MIT"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
