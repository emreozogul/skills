[package]
name = "kb"
version = "0.1.0"
edition = "2021"
description = "Knowledge bridge — unified SQLite FTS5 index over project-memory, transcripts, insights, notes, and structured data sources"
license = "MIT"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
