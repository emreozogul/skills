[package]
name = "pix"
version = "0.1.0"
edition = "2021"
description = "Pixel art pipeline: palette quantization, downscale, dither, spritesheet packing for Godot/Unity"
license = "MIT"

[[bin]]
name = "pix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
