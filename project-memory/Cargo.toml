[package]
name = "pj"
version = "0.1.0"
edition = "2021"
description = "Per-pject memory + switcher for Claude Code — lets Claude remember context across sessions"
license = "MIT"

[[bin]]
name = "pj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
