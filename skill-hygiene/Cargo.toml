[package]
name = "skh"
version = "0.1.0"
edition = "2021"
description = "Skill hygiene auditor — find duplicate, unused, and low-quality skills in your Claude Code installation"
license = "MIT"

[[bin]]
name = "skh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
